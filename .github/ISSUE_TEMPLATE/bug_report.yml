name: 🐛 Bug 反馈
description: 页面、样式、交互、部署或分享功能出问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先确认：使用最新版页面刷新过、并且没有安装奇怪的脚本。
  - type: input
    id: page
    attributes:
      label: 出现问题的页面 / 操作
      placeholder: 例如：结果页 → 生成人格卡；或者答题第 20 题
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 设备 / 浏览器
      placeholder: 例如：Android 16 微信内置浏览器 / Chrome 157，390×844
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 问题描述与复现步骤
      placeholder: 期望发生什么、实际发生什么、能否稳定复现
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / 录屏（可选）
      placeholder: 拖拽图片到这里
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认这不是对任何现实当事人的骚扰或攻击内容
          required: true
